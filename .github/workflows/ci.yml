name: 测试与发布
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_release.py --check
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONIOENCODING: utf-8
  release:
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/publish_release.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Release标题仅保留版本号
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, re, subprocess
          releases = json.loads(subprocess.check_output(['gh', 'release', 'list', '--limit', '100', '--json', 'tagName'], text=True))
          for release in releases:
              tag = release['tagName']
              match = re.match(r'^v\d+\.\d+\.\d+', tag)
              if match:
                  subprocess.run(['gh', 'release', 'edit', tag, '--title', match.group()], check=True)
          PY
